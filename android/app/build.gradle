plugins {
    id 'com.android.application'
}

// 版本号来源：android/version.properties（发版时与 service 仓 apps/miniapp/src/manifest.json 保持一致，
// 由 node scripts/release.mjs validate 校验 VERSION_CODE 不低于 release/records/ 历史最大值）
def versionProps = new Properties()
def versionPropsFile = rootProject.file('version.properties')
if (versionPropsFile.exists()) {
    versionPropsFile.withInputStream { versionProps.load(it) }
}
def appVersionCode = (versionProps.getProperty('VERSION_CODE') ?: '1') as Integer
def appVersionName = versionProps.getProperty('VERSION_NAME') ?: '1.0.0'

android {
    // 暂定包名：上架前必须替换为公司自有域名倒序（见 android/README.md）。
    // 包名一经上架不可更改，高德 Key 绑定包名 + 签名 SHA1，替换后需同步更换。
    namespace 'com.xiaomayi.tire'
    // compileSdk / targetSdk 以商店要求与 DCloud 离线 SDK 实际支持为准（设计文档 §10：商店要求 targetSdk 35）
    compileSdk 35

    defaultConfig {
        applicationId 'com.xiaomayi.tire'
        // minSdk 24：DCloud 5.33 SDK 的 uni-AD 组件（Funlink_adapter_uniad 等 AAR）要求 minSdk >= 24，
        // 21 会在清单合并阶段失败；Android 7.0 以下设备占比已趋近于零
        minSdk 24
        targetSdk 35
        versionCode appVersionCode
        versionName appVersionName
        multiDexEnabled true
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    signingConfigs {
        release {
            // 真实签名信息放 android/signing.properties（不入库），模板见 android/signing-template.properties
            def signingPropsFile = rootProject.file('signing.properties')
            if (signingPropsFile.exists()) {
                def signingProps = new Properties()
                signingPropsFile.withInputStream { signingProps.load(it) }
                storeFile signingPropsFile.parentFile.toPath().resolve(signingProps.getProperty('storeFile')).toFile()
                storePassword signingProps.getProperty('storePassword')
                keyAlias signingProps.getProperty('keyAlias')
                keyPassword signingProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // signing.properties 存在时才启用正式签名；缺失时产出未签名 APK（app-release-unsigned.apk），
            // 供 CI 构建验证或事后 apksigner 签名（keystore 安全见 android/README.md）
            if (rootProject.file('signing.properties').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // DCloud 官方离线打包要求（HBuilder-Integrate-AS 示例工程）：
    // 默认 ignoreAssetsPattern 含 <dir>_*，会忽略 appid 目录 assets/apps/__UNI__TIRE001/，
    // 导致前端资源不进 APK；ignoreAssetsPattern 必须去掉该段。
    aaptOptions {
        additionalParameters '--auto-add-overlay'
    }
    // ignoreAssetsPattern 必须用 AGP 8 的 androidResources 新 DSL 声明（aaptOptions 旧 DSL 在
    // AGP 8.7 下不生效，默认 pattern 的 <dir>_* 会把 assets/apps/__UNI__TIRE001（'_' 开头目录）
    // 在资产合并阶段整体丢弃，产出空壳白屏 APK）；
    // 这里 pattern 全否定 = 不忽略任何文件（.svn/.git 等本就不在源码树）
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!CVS:!thumbs.db:!picasa.ini:!*.scc:!~*.*'
    }

    // uniapp-v8-release.aar 清单声明 android:extractNativeLibs="true"（原生加载器依赖解压后的 .so），
    // 应用侧未声明时 AGP 8 清单合并报错；useLegacyPackaging 令应用清单与其对齐
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // DCloud 离线打包 SDK 为授权产物，不入库（app/libs/ 已 gitignore）：
    // 从 https://nativesupport.dcloud.net.cn/AppDocs/download/android 下载后，
    // 将 aar 放入 app/libs/，由下行引入；前端资源放入 app/src/main/assets/apps/<APPID>/www
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    // DCloud 5+ 运行时依赖的第三方库（版本与官方示例工程一致，见 HBuilder-Integrate-AS/simpleDemo）
    implementation 'androidx.appcompat:appcompat:1.1.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    implementation 'androidx.core:core:1.1.0'
    implementation 'androidx.fragment:fragment:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'com.facebook.fresco:fresco:2.5.0'
    implementation 'com.facebook.fresco:animated-gif:2.5.0'
    implementation 'com.github.bumptech.glide:glide:4.9.0'
    implementation 'com.alibaba:fastjson:1.2.83'
    implementation 'androidx.webkit:webkit:1.5.0'
}
