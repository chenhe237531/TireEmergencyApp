# 正式签名配置模板（issue #11）。
# 使用方法：复制本文件为 android/signing.properties（已被 .gitignore 忽略，禁止入库），
# 并填入真实值；android/app/build.gradle 的 signingConfigs.release 会自动读取。
#
# 生成 keystore 示例（生成后离线备份；丢失将无法覆盖安装与商店更新，见 android/README.md）：
#   keytool -genkeypair -v -keystore tire-release.jks -alias tire-release \
#     -keyalg RSA -keysize 2048 -validity 36500
#
# storeFile 为相对 android/ 目录的路径
storeFile=tire-release.jks
storePassword=
keyAlias=tire-release
keyPassword=
